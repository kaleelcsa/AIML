##############################################################################
# Secret - Database Credentials
##############################################################################
# Stores sensitive database credentials for Azure Database for PostgreSQL.
#
# IMPORTANT: In production, use Azure Key Vault with the CSI driver instead
# of storing secrets directly in YAML files. See the README for setup
# instructions with Azure Key Vault Provider for Secrets Store CSI Driver.
#
# To create this secret via CLI instead of applying this file:
#   kubectl create secret generic db-credentials \
#     --namespace=app-migration \
#     --from-literal=DB_USER='your-db-user@your-server' \
#     --from-literal=DB_PASSWORD='your-db-password'
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app-migration
  labels:
    app.kubernetes.io/name: db-credentials
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: azure-migration
type: Opaque
# Replace these base64-encoded values with your actual credentials
# echo -n 'your-user@your-server' | base64
# echo -n 'your-password' | base64
data:
  DB_USER: PHlvdXItZGItdXNlckB5b3VyLXNlcnZlcj4=
  DB_PASSWORD: PHlvdXItZGItcGFzc3dvcmQ+
