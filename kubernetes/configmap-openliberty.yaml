##############################################################################
# ConfigMap - Open Liberty App Layer Configuration
##############################################################################
# Stores non-sensitive configuration for the Open Liberty application server.
# Database connection details (non-sensitive) are stored here.
# Sensitive values (passwords) are in the Secret resource.
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: openliberty-config
  namespace: app-migration
  labels:
    app.kubernetes.io/name: openliberty
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: azure-migration
data:
  # Azure Database for PostgreSQL connection details
  # Replace with your actual Azure PostgreSQL server hostname
  DB_HOST: "<your-server>.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  # Additional app configuration
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
