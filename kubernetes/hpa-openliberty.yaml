##############################################################################
# HorizontalPodAutoscaler - Open Liberty Application Layer
##############################################################################
# Automatically scales Open Liberty pods based on CPU and memory utilization.
# Minimum 2 pods for high availability, maximum 8 for peak load.
##############################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openliberty-hpa
  namespace: app-migration
  labels:
    app.kubernetes.io/name: openliberty
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: azure-migration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openliberty-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
