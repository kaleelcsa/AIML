# =============================================================================
# Apache2 Virtual Host Configuration - Reverse Proxy to Open Liberty
# =============================================================================
# The BACKEND_HOST and BACKEND_PORT environment variables are set via
# Kubernetes ConfigMap to point to the Open Liberty service.
# =============================================================================

# Define backend using environment variables (set defaults for local testing)
Define BACKEND_HOST ${BACKEND_HOST}
Define BACKEND_PORT ${BACKEND_PORT}

<VirtualHost *:80>
    ServerName localhost

    # Document root for static content
    DocumentRoot "/usr/local/apache2/htdocs"

    # Static content directory
    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Reverse proxy to Open Liberty application server
    # All application requests are forwarded to the Open Liberty backend
    ProxyPreserveHost On
    ProxyPass /health !
    ProxyPass / http://${BACKEND_HOST}:${BACKEND_PORT}/
    ProxyPassReverse / http://${BACKEND_HOST}:${BACKEND_PORT}/

    # Proxy timeouts
    ProxyTimeout 120

    # Forward client IP information
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"

    # Access and error logging
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined_with_time
</VirtualHost>
