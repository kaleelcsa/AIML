# =============================================================================
# Open Liberty Bootstrap Properties
# =============================================================================
# These properties are loaded at server startup before server.xml is processed.
# Environment variables from Kubernetes ConfigMaps/Secrets override these defaults.
# =============================================================================

# Default database connection properties (overridden by K8s env vars)
default.db.host=localhost
default.db.port=5432
default.db.name=appdb

# Application settings
com.ibm.ws.logging.console.format=json
com.ibm.ws.logging.console.log.level=info
com.ibm.ws.logging.console.source=message,accessLog,ffdc,trace
